<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♟ Échecs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>♟ Échecs</h1>
      <div class="controls">
        <select id="modeSelect">
          <option value="local">👥 Local 2 joueurs</option>
          <option value="ai">🤖 vs IA</option>
        </select>
        <select id="colorSelect">
          <option value="w">Blanc</option>
          <option value="b">Noir</option>
        </select>
        <button id="newGameBtn">Nouvelle partie</button>
        <button id="undoBtn">↩ Annuler</button>
      </div>
    </header>
    <main id="main">
      <div id="boardContainer">
        <div id="board"></div>
      </div>
      <aside id="sidebar">
        <div id="statusBar">
          <span id="turnIndicator"></span>
          <span id="statusText"></span>
          <span id="moveCount"></span>
        </div>
        <div id="historyPanel">
          <h3>📜 Coups</h3>
          <div id="moveList"></div>
        </div>
      </aside>
    </main>
    <div id="promotionDialog" class="hidden">
      <div class="promotion-content">
        <p>Promotion</p>
        <div id="promotionChoices"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
